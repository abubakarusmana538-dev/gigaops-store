apiVersion: v1
kind: ResourceQuota
metadata: {name: store-quota, namespace: gigaops-store}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata: {name: store-limits, namespace: gigaops-store}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 64Mi}
      default: {cpu: 500m, memory: 256Mi}
