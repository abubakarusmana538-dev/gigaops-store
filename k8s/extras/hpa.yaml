# Requires metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: product-hpa, namespace: gigaops-store}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: product}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: order-hpa, namespace: gigaops-store}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: order}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
