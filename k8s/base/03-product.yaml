apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: gigaops-store
spec:
  selector:
    app: product
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: gigaops-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product
          image: gigaops/gigaops-product:v1
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet: {path: /health, port: 5001}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5001}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
