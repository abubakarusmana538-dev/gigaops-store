apiVersion: v1
kind: ConfigMap
metadata:
  name: store-config
  namespace: gigaops-store
data:
  DB_HOST: mysql
  DB_NAME: storedb
  DB_USER: storeuser
  PRODUCT_URL: http://product-service:5001
---
# LAB VALUES ONLY. In real environments create this Secret out-of-band
# (kubectl create secret / Sealed Secrets / External Secrets / Vault).
apiVersion: v1
kind: Secret
metadata:
  name: store-secret
  namespace: gigaops-store
type: Opaque
stringData:
  DB_PASSWORD: StorePass123!
  MYSQL_ROOT_PASSWORD: RootPass123!
