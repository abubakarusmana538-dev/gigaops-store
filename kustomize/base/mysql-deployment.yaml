apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: store-secret, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_DATABASE
              valueFrom: {configMapKeyRef: {name: store-config, key: MYSQL_DATABASE}}
            - name: MYSQL_USER
              valueFrom: {configMapKeyRef: {name: store-config, key: MYSQL_USER}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: store-secret, key: DB_PASSWORD}}
