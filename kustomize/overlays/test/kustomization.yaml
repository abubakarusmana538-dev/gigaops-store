apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gigaops-test
resources:
  - ../../base
images:
  - name: gigaops/gigaops-frontend
    newTag: v2
  - name: gigaops/gigaops-product
    newTag: v2
  - name: gigaops/gigaops-order
    newTag: v2
replicas:
  - name: frontend
    count: 2
  - name: product
    count: 2
  - name: order
    count: 2
  - name: mysql
    count: 1
patches:
  - path: frontend-service-patch.yaml
