apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gigaops-dev
resources:
  - ../../base
images:
  - name: gigaops/gigaops-frontend
    newTag: v1
  - name: gigaops/gigaops-product
    newTag: v1
  - name: gigaops/gigaops-order
    newTag: v1
replicas:
  - name: frontend
    count: 1
  - name: product
    count: 1
  - name: order
    count: 1
  - name: mysql
    count: 1
patches:
  - path: frontend-service-patch.yaml
