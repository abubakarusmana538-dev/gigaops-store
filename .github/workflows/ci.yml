name: ci
on:
  push: {branches: [main]}
  pull_request:

env:
  REGISTRY_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Python syntax check
        run: python -m py_compile services/*/app.py services/order-service/wsgi.py
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          helm lint helm/gigaops-store
          for e in dev test prod; do
            helm template gigaops-$e helm/gigaops-store -n gigaops-$e -f helm/gigaops-store/values-$e.yaml >/dev/null
          done
      - name: Kustomize build
        run: for e in dev test prod; do kubectl kustomize kustomize/overlays/$e >/dev/null; done

  images:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: gigaops-frontend, path: services/frontend}
          - {name: gigaops-product,  path: services/product-service}
          - {name: gigaops-order,    path: services/order-service}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
